[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zframe"
version = "0.3.0"
description = "Multi-product API automation framework — framework separated from case repos"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ZFrame" }]
keywords = ["api", "automation", "pytest", "httpx", "websocket", "testing"]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "PyYAML>=6.0",
    "jsonpath-ng>=1.6.0",
    "jsonschema>=4.20.0",
    "pytest>=7.0",
    "pytest-html>=4.1.0",
    "paramiko>=3.0",
    "PyMySQL>=1.1.0",
    "httpx-ws>=0.7.0",
]

[project.optional-dependencies]
# Feature packages live in main deps so a plain wheel install works.
# Extras kept as no-op aliases for older install commands (zframe[db], etc.).
html = ["pytest-html>=4.1.0"]
ssh = ["paramiko>=3.0"]
db = ["PyMySQL>=1.1.0", "paramiko>=3.0"]
ws = ["httpx-ws>=0.7.0"]
dev = [
    "pytest-cov>=4.0",
    "respx>=0.21.0",
]

[project.entry-points.pytest11]
zframe = "zframe.plugin.pytest_plugin"

[project.scripts]
zframe = "zframe.cli:main"
zframe-parallel = "zframe.parallel:main"

[project.urls]
Homepage = "https://github.com/example/zframe"

[tool.hatch.build.targets.sdist]
include = [
    "src/zframe",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel.force-include]
"docs" = "zframe/docs"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --import-mode=importlib"

[tool.coverage.run]
source = ["zframe"]
branch = true
